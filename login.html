<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রশাসনিক লগইন - ইউনিয়ন ও পৌরসভা ম্যানেজমেন্ট সিস্টেম</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SolaimanLipi', sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .login-card { width: 100%; max-width: 400px; background: #fff; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #006a4e; }
        h2 { color: #006a4e; font-size: 22px; text-align: center; margin-bottom: 5px; }
        p { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #334155; }
        input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
        input:focus { border-color: #006a4e; }
        
        .btn-login { width: 100%; background: #006a4e; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-login:hover { background: #004d37; }
        
        .error-msg { color: #ef4444; font-size: 12px; text-align: center; margin-top: 12px; display: none; background: #fef2f2; padding: 8px; border-radius: 4px; border: 1px solid #fecaca; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 12px; color: #64748b; text-decoration: none; }
        .back-link:hover { color: #006a4e; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>প্রশাসনিক প্যানেল</h2>
        <p>সঠিক ইউজারনেম ও পাসওয়ার্ড টাইপ করে লগইন করুন</p>
        
        <div class="form-group">
            <label>ইউজারনেম (Username)</label>
            <input type="text" id="username" placeholder="ইউজার আইডি লিখুন" required>
        </div>
        
        <div class="form-group">
            <label>পাসওয়ার্ড (Password)</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <button type="button" class="btn-login" onclick="validateLogin()">লগইন করুন</button>
        
        <div id="errorMsg" class="error-msg">⚠️ ভুল ইউজারনেম অথবা পাসওয়ার্ড! সঠিক তথ্য দিন।</div>
        
        <a href="index.html" class="back-link">← হোম পেজে ফিরে যান</a>
    </div>

    <script>
        function validateLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // ১. চরসিন্দুর ইউনিয়ন পরিষদ
            if (user === 'cu420' && pass === 'ai420') {
                localStorage.setItem('adminOffice', 'চরসিন্দুর ইউনিয়ন পরিষদ কার্যালয়');
                window.location.href = 'dashboard.html';
            } 
            // ২. ঘোড়াশাল পৌরসভা কার্যালয়
            else if (user === 'gp420' && pass === 'ai420') {
                localStorage.setItem('adminOffice', 'ঘোড়াশাল পৌরসভা কার্যালয়');
                window.location.href = 'dashboard.html';
            } 
            else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
